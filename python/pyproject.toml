[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gvision"
version = "0.1.0"
description = "Perception and agent processes for the G-VISION game assistant"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gvision = "gvision.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
