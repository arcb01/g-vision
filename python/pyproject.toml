[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gvision"
version = "0.1.0"
description = "Perception and agent processes for the G-VISION game assistant"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "websockets>=13",
]

[project.optional-dependencies]
# Tracking runs anywhere; the rest of perception needs Windows + an NVIDIA GPU.
# Install a CUDA build of torch first (see README), or pip pulls the CPU one.
tracking = ["numpy>=1.26", "scipy>=1.11"]
perception = [
    "gvision[tracking]",
    "ultralytics>=8.4.172",  # first version tested; uses quantize= instead of half=
    "opencv-python>=4.9",
    "dxcam>=0.0.5; sys_platform == 'win32'",
]
# "find X": Qwen client, push-to-talk, faster-whisper and Kokoro (plan 9).
agent = ["gvision[tracking]", "httpx>=0.27"]
voice = [
    "gvision[agent]",
    "faster-whisper>=1.1",
    "kokoro-onnx>=0.4",
    "sounddevice>=0.4.6",
    "pynput>=1.7",
    # CUDA libraries faster-whisper loads on Windows (found by audio/asr.py).
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
]
dev = ["pytest>=8", "gvision[tracking,agent]"]

[project.scripts]
gvision = "gvision.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
