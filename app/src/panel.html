<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>G-VISION</title>
    <style>
      :root { color-scheme: light dark; font-family: 'Segoe UI', system-ui, sans-serif; }
      body { margin: 0; padding: 20px 24px; background: Canvas; color: CanvasText; }
      h1 { font-size: 18px; margin: 0 0 16px; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.7; margin: 20px 0 8px; }
      .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; background: #8884; }
      .pill.ok { background: #2e9e5b; color: #fff; }
      .pill.listening { background: #d9534f; color: #fff; }
      .pill.thinking, .pill.speaking { background: #ffc83d; color: #000; }
      #heard { font-style: italic; }
      table { border-collapse: collapse; font-size: 13px; }
      td { padding: 2px 16px 2px 0; }
      .segment { padding: 2px 4px; border-radius: 4px; }
      .segment.active { background: #ffc83d55; }
      .row { display: flex; gap: 12px; align-items: center; }
      code { font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>G-VISION <span id="conn" class="pill">disconnected</span></h1>

    <h2>Dashboard</h2>
    <table id="status"><tr><td>No status yet</td></tr></table>

    <h2>Voice</h2>
    <p><span id="voice-state" class="pill">idle</span> <span id="heard"></span></p>

    <h2>Answer</h2>
    <p id="answer">No answer yet</p>

    <h2>Controls</h2>
    <div class="row">
      <button id="clear">Clear highlights</button>
      <label>Dim strength <input id="dim" type="range" min="0" max="0.9" step="0.05" value="0.6" /> <span id="dim-value">60%</span></label>
    </div>

    <h2>Messages received</h2>
    <table id="counts"></table>

    <script src="panel.js"></script>
  </body>
</html>
